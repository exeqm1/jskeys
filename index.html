<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSKeys</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <script src="nexus-js/NexusUI.js"></script>
    
</head>

<body>
    <header>
        <div class="container">
            <div class="navbar">
                <a class="brand" href="#">JSKeys</a>
                <a href="#">
                    <img class="logo" src="/resources/logo.png" alt="Logo JSKeys" />
                </a>
                <nav>
                    <a href="#" data-modal="como-usar">Cómo usar</a>
                    <a href="#" data-modal="sobre">Sobre</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Piano interactivo con JavaScript</h1>
            <p>
                Toca las teclas con el ratón o usa tu teclado para crear melodías.
            </p>
        </section>

        <section class="panel-piano" aria-label="Piano virtual">
            <div class="piano-layout">
                <div class="piano-stage">
                    <h2>Teclado</h2>
                    <div id="piano"></div>
                </div>

                <aside class="piano-controls" aria-label="Controles del piano">
                    <div class="micro-control">
                        <label class="label" for="wave-type-selector">Onda</label>
                        <div class="custom-select-wrapper" id="wave-type-selector">
                            <div class="custom-select-header" tabindex="0">
                                <span class="selected-value" data-value="square">Square</span>
                                <span class="arrow-icon"></span>
                            </div>
                            <div class="custom-select-options">
                                <div class="custom-option" data-value="square">Square</div>
                                <div class="custom-option" data-value="sine">Sine</div>
                                <div class="custom-option" data-value="sawtooth">Saw</div>
                                <div class="custom-option" data-value="triangle">Triangle</div>
                            </div>
                        </div>
                    </div>

                    <div class="micro-control">
                        <label class="label">Gain</label>
                        <div id="gain-dial" class="gain-dial"></div>
                    </div>
                </aside>
            </div>
        </section>

        <section class="panel-settings settings" aria-label="Configuración">
            <h2>Configuración</h2>
            <div class="content">
                <div class="settings-stack">
                    <div class="panel-box-asdr">
                        <h3>Controlador ASDR</h3>
                        <div class="dial-group">
                            <label>Attack</label>
                            <div id="attack-dial" class="nexus-dial"></div>
                            <span id="attack-value" class="value">0.1</span>
                        </div>
                        <div class="dial-group">
                            <label>Decay</label>
                            <div id="decay-dial" class="nexus-dial"></div>
                            <span id="decay-value" class="value">0.1</span>
                        </div>
                        <div class="dial-group">
                            <label>Sustain</label>
                            <div id="sustain-dial" class="nexus-dial"></div>
                            <span id="sustain-value" class="value">0.5</span>
                        </div>
                        <div class="dial-group">
                            <label>Release</label>
                            <div id="release-dial" class="nexus-dial"></div>
                            <span id="release-value" class="value">0.5</span>
                        </div>
                    </div>

                    <div class="panel-box-lpf">
                        <h3>LPF</h3>
                        <div class="dial-group">
                            <label>Cutoff</label>
                            <div id="cutoff-dial" class="nexus-dial"></div>
                            <span id="cutoff-value" class="value">2200</span>
                        </div>
                        <div class="dial-group">
                            <label>Resonance</label>
                            <div id="resonance-dial" class="nexus-dial"></div>
                            <span id="resonance-value" class="value">1.5</span>
                        </div>
                    </div>

                    <div class="panel-box-oscilloscope">
                        <h3>Waveform</h3>
                        <div id="oscilloscope" class="oscilloscope">
                </div>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>© 2026 <a href="https://github.com/exeqm1" target="_blank">exeqm1</a> · JSKeys.</p>
        </div>
    </footer>

    <div class="modal" id="modal">
        <div class="modal__overlay" data-close></div>
        <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="modal__close" type="button" data-close>✕</button>
            <h2 id="modal-title">Título</h2>
            <div class="modal__body"></div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
